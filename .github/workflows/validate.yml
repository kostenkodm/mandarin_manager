name: Validate OpenWrt scripts
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          for f in install.sh uninstall.sh update.sh root/usr/bin/mandarin-vpn root/usr/bin/mandarin-vpn-guest-prepare root/usr/bin/mandarin-vpn-guest-diagnose root/usr/libexec/rpcd/mandarinvpn; do
            sh -n "$f"
          done
      - name: Check LuCI JavaScript
        run: node --check root/www/luci-static/resources/view/mandarin-vpn/index.js
      - name: Check JSON
        run: |
          python3 - <<'PYJSON'
          import json, pathlib
          for p in pathlib.Path('root').rglob('*.json'):
              json.loads(p.read_text())
          PYJSON
